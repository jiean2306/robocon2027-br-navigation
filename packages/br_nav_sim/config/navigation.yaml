field_map:
  ros__parameters:
    frame_id: map
    resolution: 0.05
    width_m: 6.0
    height_m: 6.0
    # First pass is a free L1 floor with a one-cell lethal outer boundary.
    # Add measured barriers/obstacles from Appendix coordinates in the next pass.
    boundary_cells: 1

astar_planner:
  ros__parameters:
    frame_id: map
    start_x: 1.0
    start_y: 1.0
    allow_diagonal: true
    occupied_threshold: 50

# ============================================================================
# ABU Robocon 2027 Builder Robot (BR v7 Fusion 360) Navigation Sandbox Parameters
# Grounded in ABU Robocon 2027 Rulebook V1.1 & Appendix V1.1 + Fusion 360 BR v7 CAD:
#   * BR v7 CAD footprint:      702.5 x 696.5 x 696.0 mm (~0.70 m x 0.70 m)
#   * Inscribed radius:         0.35 m
#   * Circumscribed radius:     0.495 m (~0.50 m)
#   * Starting pose:            Red Ground Start/Retry Zone (-4.35, -5.15, z=0.00 m)
# ============================================================================

/**:
  ros__parameters:
    grid_resolution: 0.05
    inscribed_radius: 0.35
    circumscribed_radius: 0.50
    inflation_radius: 0.80
    cost_scaling_factor: 5.0
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    lidar_frame: lidar_link

occupancy_mapper:
  ros__parameters:
    grid_resolution: 0.05
    width_m: 11.4
    height_m: 11.4
    origin_x: -5.7
    origin_y: -5.7
    p_occ: 0.70
    p_free: 0.30
    l_min: -4.0
    l_max: 4.0
    occ_prob_threshold: 0.65
    free_prob_threshold: 0.35
    pre_scan_l1_arena: true

traversability_costmap:
  ros__parameters:
    grid_resolution: 0.05
    inscribed_radius: 0.35
    circumscribed_radius: 0.50
    inflation_radius: 0.80
    cost_scaling_factor: 5.0
    robot_length_m: 0.7025
    robot_width_m: 0.6965
    team_side: red
    enforce_l1_arena_bounds: true

astar_pathfinder:
  ros__parameters:
    grid_resolution: 0.05
    inscribed_radius: 0.35
    inflation_radius: 0.80
    cost_scaling_factor: 5.0
    cost_penalty_weight: 4.0
    allow_diagonal: true
    allow_unknown: true
    default_start_x: -1.85
    default_start_y: 2.45
    auto_publish_demo_goal: true
    demo_goal_x: -0.55
    demo_goal_y: -2.45

l1_sim_bridge:
  ros__parameters:
    initial_x: -4.35
    initial_y: -5.15
    initial_z: 0.00
    initial_yaw: 1.5707963
    lidar_offset_x: 0.0
    lidar_offset_y: 0.0
    lidar_offset_z: 0.25
    publish_internal_scan: true
    publish_internal_odom: true
    auto_follow_path: false
    follow_speed_mps: 0.65
    num_beams: 360
    range_min: 0.08
    range_max: 8.0
